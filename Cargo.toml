[package]
name = "openpatience"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Beautiful offline Solitaire for Linux — 7 classic variants"
authors = ["Abdelkader Berassil <abdelkader@example.com>"]
repository = "https://github.com/abdelkader/openpatience"
homepage = "https://github.com/abdelkader/openpatience"
keywords = ["solitaire", "cards", "game", "gtk", "linux"]
categories = ["games"]
readme = "README.md"

[lib]
name = "openpatience"
path = "src/lib.rs"

[[bin]]
name = "openpatience"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_xoshiro = "0.6"

gtk4 = "0.10"
libadwaita = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
