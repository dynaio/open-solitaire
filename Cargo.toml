[package]
name = "openpatience"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Beautiful offline Solitaire for Linux"

[lib]
name = "openpatience"
path = "src/lib.rs"

[[bin]]
name = "openpatience"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_xoshiro = "0.6"

gtk4 = "0.10"
libadwaita = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
